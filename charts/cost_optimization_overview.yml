# Reads exclusively from the cost optimization package's gold-layer views via
# ref() - see dbt_charts.yml at the repo root for why this board has to sit
# next to the real dbt_project.yml for that to resolve.
#
# Source models (from the dbt_cost_optimization_package):
#   vw_snowflake__cost_savings_summary
#   vw_snowflake__cross_domain_insights
#   vw_snowflake__dbt_model_optimizations
#   vw_snowflake__optimization_backlog
#   vw_snowflake__warehouse_optimizations
#
# Build these first with `dbt build --vars '{dbt_cost_optimization_enabled: true}'
# --select tag:dbt_cost_optimization`, then `dbt compile`, before rendering
# this board - see training_assets/cost_charts/README.md for the full sequence.

title: "dbt cost optimization recommendations"
notes: "Recommendations from the dbt cost optimization package's gold-layer views."
source: cost_optimization

# dct's default theme title-cases every heading, KPI label, and table
# column header regardless of authored casing - confirmed by inspecting
# rendered SVG text nodes. style.font.case alone doesn't reach any of
# these (the default theme sets its own font.case per slot, which wins
# over the style.font fallback), so each slot is overridden directly to
# match dbt Labs' brand guideline (sentence-case headlines, not title
# case).
style:
  font:
    case: sentence
  title:
    font:
      case: sentence
  charts:
    kpi:
      label:
        font:
          case: sentence
    table:
      header:
        font:
          case: sentence

text: |
  Built from the dbt cost optimization package's gold-layer views:
  `vw_snowflake__cost_savings_summary`, `vw_snowflake__cross_domain_insights`,
  `vw_snowflake__dbt_model_optimizations`, `vw_snowflake__optimization_backlog`,
  and `vw_snowflake__warehouse_optimizations`.


queries:
  # ---- KPI row -------------------------------------------------------
  headline_totals: |
    SELECT
      SUM(ESTIMATED_ANNUAL_SAVINGS_USD) AS total_savings,
      SUM(TOTAL_RECOMMENDATIONS) AS total_recommendations,
      SUM(QUICK_WIN_COUNT) AS quick_wins
    FROM {{ ref('vw_snowflake__cost_savings_summary') }}

  # A per-user-cost KPI invites a meaningless comparison against this
  # aggregate headline figure, so it's left out - this is the biggest single
  # line item on the board instead.
  top_recommendation: |
    SELECT ESTIMATED_ANNUAL_SAVINGS_USD AS savings, RECOMMENDATION AS recommendation
    FROM {{ ref('vw_snowflake__warehouse_optimizations') }}
    ORDER BY savings DESC NULLS LAST
    LIMIT 1

  # ---- Savings by domain (cost vs. savings) ---------------------------
  # dct lowercases all result column names regardless of SQL casing, so
  # every column below is aliased in lowercase to match what the chart
  # field mappings actually see.
  domain_cost_vs_savings: |
    SELECT DOMAIN AS domain, 'Estimated cost' AS metric, ESTIMATED_ANNUAL_COST_USD AS value
    FROM {{ ref('vw_snowflake__cost_savings_summary') }}
    UNION ALL
    SELECT DOMAIN AS domain, 'Estimated savings' AS metric, ESTIMATED_ANNUAL_SAVINGS_USD AS value
    FROM {{ ref('vw_snowflake__cost_savings_summary') }}
    ORDER BY domain, metric

  # ---- Savings by effort category (the "cheap fixes, big wins" story) --
  effort_savings: |
    SELECT
      EFFORT_CATEGORY AS effort_category,
      SUM(ESTIMATED_ANNUAL_SAVINGS_USD) AS savings,
      COUNT(*) AS recommendation_count
    FROM {{ ref('vw_snowflake__optimization_backlog') }}
    GROUP BY 1
    ORDER BY savings DESC NULLS LAST

  # ---- Top backlog items, ranked, tail folded -------------------------
  # Grain is (entity, domain, signal_id) - the same entity/domain pair can
  # carry more than one signal (e.g. a warehouse with both an idle-reduction
  # config signal and a spillage signal), so entity+domain alone isn't a
  # unique bar key; signal_id is appended too. entity falls back to
  # 'Unattributed' since MODEL_NAME and WAREHOUSE_NAME can both be null for some
  # signal types, which would otherwise concatenate to a null item. NULLS
  # LAST on the ranking matches this view's own convention (see its ORDER BY)
  # and avoids null-savings rows displacing real top savers into "Remaining".
  backlog_ranked: |
    WITH backlog AS (
      SELECT
        COALESCE(MODEL_NAME, WAREHOUSE_NAME, 'Unattributed') AS entity,
        DOMAIN AS domain,
        SIGNAL_ID AS signal_id,
        ESTIMATED_ANNUAL_SAVINGS_USD AS savings
      FROM {{ ref('vw_snowflake__optimization_backlog') }}
    ),
    ranked AS (
      SELECT entity, domain, signal_id, savings,
             ROW_NUMBER() OVER (ORDER BY savings DESC NULLS LAST) AS rn
      FROM backlog
    )
    SELECT entity || ' - ' || domain || ' - ' || signal_id AS item, domain, savings FROM ranked WHERE rn <= 8
    UNION ALL
    SELECT
      'Remaining ' || COUNT(*) || ' items' AS item,
      'various' AS domain,
      SUM(savings) AS savings
    FROM ranked WHERE rn > 8
    HAVING COUNT(*) > 0
    ORDER BY savings DESC NULLS LAST

  # ---- Per-model recommendation detail ---------------------------------
  scoped_models: |
    SELECT
      MODEL_NAME AS model_name,
      DOMAIN AS domain,
      RECOMMENDATION AS recommendation,
      ESTIMATED_ANNUAL_SAVINGS_USD AS savings,
      SUGGESTED_CLUSTERING_KEY AS suggested_clustering_key,
      INCREMENTAL_RECOMMENDATION_STATUS AS incremental_recommendation_status
    FROM {{ ref('vw_snowflake__dbt_model_optimizations') }}
    ORDER BY savings DESC NULLS LAST

  # ---- Warehouse + cross-domain detail tables --------------------------
  # RECOMMENDATION on this view can contain a literal em-dash in the source
  # text - swapped for a hyphen since it renders as-is in the table.
  # RECOMMENDATION_REASON is left as full text: an earlier attempt to
  # truncate it to avoid wrapping didn't change the table's pagination
  # behavior (see the rows: comment below), so a shortened, still-wrapped
  # sentence had no upside over the full one.
  warehouse_detail: |
    SELECT
      WAREHOUSE_NAME AS warehouse_name,
      REPLACE(RECOMMENDATION, CHR(8212), '-') AS recommendation,
      RECOMMENDATION_REASON AS recommendation_reason,
      ESTIMATED_ANNUAL_SAVINGS_USD AS savings,
      BACKLOG_STATUS AS backlog_status
    FROM {{ ref('vw_snowflake__warehouse_optimizations') }}
    ORDER BY savings DESC NULLS LAST

  cross_domain_detail: |
    SELECT
      MODEL_NAME AS model_name,
      SIGNAL_COUNT AS signal_count,
      PRIMARY_RECOMMENDATION AS primary_recommendation,
      ROOT_CAUSE AS root_cause
    FROM {{ ref('vw_snowflake__cross_domain_insights') }}
    ORDER BY signal_count DESC

charts:
  savings_kpi:
    label: "Estimated annual savings"
    query: headline_totals
    type: kpi
    value: total_savings
    style:
      value:
        format: currency

  recs_kpi:
    label: "Recommendations"
    query: headline_totals
    type: kpi
    value: total_recommendations
    style:
      value:
        format: integer

  quick_wins_kpi:
    label: "Quick wins"
    query: headline_totals
    type: kpi
    value: quick_wins
    style:
      value:
        format: integer

  top_recommendation_kpi:
    label: "Top single recommendation"
    query: top_recommendation
    type: kpi
    value: savings
    style:
      value:
        format: currency
    support:
      value: recommendation

  domain_bar:
    title: "Cost vs. savings by domain"
    type: bar
    query: domain_cost_vs_savings
    x: domain
    y: value
    color: metric
    style:
      # stack: none confirmed against src/dbt_charts/data/schemas/yaml/0.5.0.json
      # (BarChartStyle.stack enum: none/zero/normalize/center) and render-tested.
      stack: none
      number_format: currency

  effort_bar:
    title: "Savings by effort category"
    type: bar
    query: effort_savings
    x: effort_category
    y: savings
    style:
      number_format: currency
      # endpoint_labels was only seen paired with orientation: horizontal in
      # the reference examples, but render-tested here on this vertical
      # (default-orientation) bar and confirmed to work.
      endpoint_labels:
        visible: true

  backlog_bar:
    title: "Top backlog items by estimated annual savings"
    type: bar
    query: backlog_ranked
    x: item
    y: savings
    color: domain
    sort:
      by: savings
      order: desc
    # KNOWN COSMETIC ISSUE, not fixed: the "Remaining N items" catch-all
    # bar gets a full categorical hue from `color: domain`, competing
    # visually with the real domains as if it were another one of them.
    # Tried `conditional_formatting` on the `domain` column to force it
    # gray - dct rejects this outright: "chart.color conflicts with
    # conditional_formatting rules on column 'domain' ... Use one
    # surface." The only other lever, style.color.categorical.palette,
    # takes a positional list of color stops matched to the categorical
    # domain's encounter/sort order - fixable, but only safely with a
    # rendered check of which position 'various' actually lands in,
    # which wasn't available when this was last touched. Left as-is.
    style:
      orientation: horizontal
      number_format: currency
      endpoint_labels:
        visible: true

  scoped_models_table:
    title: "Per-model recommendations"
    type: table
    query: scoped_models
    style:
      columns:
        model_name:
          label: Model
        domain:
          label: Domain
        recommendation:
          label: Recommendation
        savings:
          label: Est. annual savings
          format: currency
          scale:
            background:
              palette: dbt-seq-blue
        suggested_clustering_key:
          label: Suggested clustering key
        incremental_recommendation_status:
          label: Incremental status

  warehouse_table:
    title: "Warehouse optimizations"
    type: table
    query: warehouse_detail
    style:
      # pagination.enabled: false (unlike min_height, which genuinely doesn't
      # exist on tables, and page_rows, which the physical-fit check
      # overrode) is what actually fixed this - render-tested to confirm
      # every row shows on one page instead of just suppressing the
      # paginator UI while still clipping.
      pagination:
        enabled: false
      columns:
        warehouse_name:
          label: Warehouse
        recommendation:
          label: Recommendation
        recommendation_reason:
          label: Why
        savings:
          label: Est. annual savings
          format: currency
        backlog_status:
          label: Status

  cross_domain_table:
    title: "Cross-domain insights"
    type: table
    query: cross_domain_detail
    style:
      columns:
        model_name:
          label: Model
        signal_count:
          label: Signals
        primary_recommendation:
          label: Primary recommendation
        root_cause:
          label: Root cause

rows:
  - title: "Headline"
    grid:
      columns: 24
      items:
        - item: savings_kpi
          col_span: 6
        - item: recs_kpi
          col_span: 6
        - item: quick_wins_kpi
          col_span: 6
        - item: top_recommendation_kpi
          col_span: 6

  - cols:
      - domain_bar
      - effort_bar

  - cols:
      - backlog_bar

  - title: "Per-model recommendations"
    cols:
      - scoped_models_table

  # warehouse_table used to client-side paginate here (fixed via
  # style.pagination.enabled: false on the chart above - the table's own
  # height genuinely grows to fit every row once pagination chrome isn't
  # reserving/capping page size).
  - cols:
      - warehouse_table

  - cols:
      - cross_domain_table
