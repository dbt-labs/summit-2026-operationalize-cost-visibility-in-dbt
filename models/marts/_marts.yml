version: 2

models:
  # =========================================================================
  # DIMENSIONS
  # =========================================================================
  - name: dim_potions
    description: Potion dimension — one row per SKU.
    config:
      contract:
        enforced: true
    columns:
      - name: potion_sku
        data_type: varchar
        description: Primary key — potion SKU.
        data_tests: [unique, not_null]
      - name: potion_name
        data_type: varchar
        description: Potion display name.
      - name: category
        data_type: varchar
        description: Potion category (lowercased).
        data_tests:
          - accepted_values:
              arguments:
                values: [healing, clarity, luck, strength, invisibility, love]
      - name: potency
        data_type: integer
        description: Potency rating, 1-10.
      - name: shelf_life_days
        data_type: integer
        description: Shelf life in days.
      - name: is_regulated
        data_type: boolean
        description: Whether the potion is regulated.
      - name: base_price_copper
        data_type: integer
        description: List price in copper pieces.
      - name: base_price_gold
        data_type: number(38, 2)
        description: List price in gold crowns.
      - name: introduced_at
        data_type: date
        description: Date the potion was introduced.

  - name: dim_shops
    description: Shop dimension — one row per shop (15 shops).
    config:
      contract:
        enforced: true
    columns:
      - name: shop_id
        data_type: varchar
        description: Primary key — shop identifier.
        data_tests: [unique, not_null]
      - name: shop_name
        data_type: varchar
        description: Shop display name.
      - name: city
        data_type: varchar
        description: City.
      - name: region
        data_type: varchar
        description: Canonical region.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
      - name: opened_at
        data_type: date
        description: Date the shop opened.

  - name: dim_wizards
    description: Wizard (customer) dimension with current guild membership.
    config:
      tags: [unoptimized]
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: varchar
        description: Primary key — wizard identifier.
        data_tests: [unique, not_null]
      - name: full_name
        data_type: varchar
        description: Wizard full name.
      - name: email
        data_type: varchar
        description: Contact email (nullable).
      - name: home_region
        data_type: varchar
        description: Conformed home region.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
      - name: favored_discipline
        data_type: varchar
        description: Favored magical discipline (lowercased).
      - name: birth_year
        data_type: integer
        description: Year of birth.
      - name: guild_id
        data_type: varchar
        description: Current guild FK (nullable).
      - name: guild_name
        data_type: varchar
        description: Current guild name (nullable).
      - name: membership_tier
        data_type: varchar
        description: Current membership tier (nullable).
      - name: is_guild_member
        data_type: boolean
        description: Whether the wizard currently belongs to a guild.
        data_tests: [not_null]
      - name: signed_up_at
        data_type: date
        description: Signup date.
      - name: member_since
        data_type: date
        description: Current-membership start date (nullable).

  - name: dim_dates
    description: Date dimension spanning the activity window.
    config:
      contract:
        enforced: true
    columns:
      - name: date_day
        data_type: date
        description: Primary key — calendar day.
        data_tests: [unique, not_null]
      - name: date_key
        data_type: integer
        description: Integer surrogate key (YYYYMMDD).
      - name: calendar_year
        data_type: integer
      - name: calendar_quarter
        data_type: integer
      - name: calendar_month
        data_type: integer
      - name: month_name
        data_type: varchar
      - name: day_of_month
        data_type: integer
      - name: day_of_week
        data_type: integer
      - name: day_name
        data_type: varchar
      - name: is_weekend
        data_type: boolean

  # =========================================================================
  # FACTS
  # =========================================================================
  - name: fct_orders
    description: Order-grain fact with revenue, payment behavior, and conformed FKs. Order-grain semantic model over fct_orders.
    config:
      tags: [unoptimized]
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: varchar
        description: Primary key — order identifier.
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: order
      - name: customer_id
        data_type: varchar
        description: FK to dim_wizards.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_wizards')
                field: customer_id
        entity:
          type: foreign
          name: customer
      - name: shop_id
        data_type: varchar
        description: FK to dim_shops.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_shops')
                field: shop_id
        entity:
          type: foreign
          name: shop
      - name: fulfillment_region
        data_type: varchar
        description: Region of the fulfilling shop.
        dimension:
          type: categorical
      - name: order_status
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, returned, cancelled, placed]
        dimension:
          type: categorical
      - name: channel
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [in_store, courier_owl, marketplace]
        dimension:
          type: categorical
      - name: line_item_count
        data_type: integer
      - name: total_quantity
        data_type: integer
      - name: gross_revenue_gold
        data_type: number(38, 2)
      - name: discount_gold
        data_type: number(38, 2)
      - name: net_revenue_gold
        data_type: number(38, 2)
        data_tests: [not_null]
      - name: amount_paid_gold
        data_type: number(38, 2)
      - name: is_split_payment
        data_type: boolean
      - name: had_failed_attempt
        data_type: boolean
      - name: is_refunded
        data_type: boolean
      - name: ordered_at
        data_type: timestamp_ntz
        data_tests: [not_null]
      - name: ordered_date
        data_type: date
        dimension:
          type: time
        granularity: day
      - name: source_updated_at
        data_type: timestamp_ntz
        description: Latest raw-record ingestion timestamp across the order, its line items, and its payment attempts; used as the fct_orders incremental high-watermark.
        data_tests: [not_null]

    semantic_model:
      enabled: true
      name: fct_orders
    agg_time_dimension: ordered_date
    metrics:
      - name: total_net_revenue
        description: Net revenue across all orders, in gold crowns.
        type: simple
        label: Total net revenue (gold)
        agg: sum
        agg_time_dimension: ordered_date
        expr: net_revenue_gold
      - name: total_orders
        description: Count of orders.
        type: simple
        label: Total orders
        agg: count
        agg_time_dimension: ordered_date
        expr: order_id
      - name: gross_revenue
        description: Gross line revenue in gold crowns.
        agg: sum
        expr: gross_revenue_gold
        agg_time_dimension: ordered_date

        type: simple
        hidden: true
  - name: fct_order_items
    description: Line-grain fact — one row per potion per order. Line-grain semantic model over fct_order_items.
    config:
      tags: [unoptimized]
      contract:
        enforced: true
    columns:

      - name: order_item_id
        data_type: varchar
        description: Primary key — line item identifier.
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: order_item
      - name: order_id
        data_type: varchar
        description: FK to fct_orders.
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
        entity:
          type: foreign
          name: order
      - name: potion_sku
        data_type: varchar
        description: FK to dim_potions.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_potions')
                field: potion_sku
        entity:
          type: foreign
          name: potion
      - name: customer_id
        data_type: varchar
        description: FK to dim_wizards (denormalized from order).
      - name: shop_id
        data_type: varchar
        description: FK to dim_shops (denormalized from order).
      - name: quantity
        data_type: integer
      - name: unit_price_gold
        data_type: number(38, 2)
      - name: line_revenue_gold
        data_type: number(38, 2)
        data_tests: [not_null]
      - name: ordered_at
        data_type: timestamp_ntz
      - name: ordered_date
        data_type: date

        dimension:
          type: time
        granularity: day
    semantic_model:
      enabled: true
      name: fct_order_items
    agg_time_dimension: ordered_date
    metrics:
      - name: total_units_sold
        description: Total potion units sold across all order lines.
        type: simple
        label: Total units sold
        agg: sum
        agg_time_dimension: ordered_date
        expr: quantity
      - name: line_revenue
        description: Line revenue in gold crowns.
        agg: sum
        expr: line_revenue_gold
        agg_time_dimension: ordered_date
        type: simple
        hidden: true
  - name: fct_payments
    description: Payment-attempt-grain fact — one row per payment attempt.
    config:
      contract:
        enforced: true
    columns:
      - name: payment_id
        data_type: varchar
        description: Primary key — payment identifier.
        data_tests: [unique, not_null]
      - name: order_id
        data_type: varchar
        description: FK to fct_orders.
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: customer_id
        data_type: varchar
        description: FK to dim_wizards (denormalized from order).
      - name: payment_method
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [coin, guild_credit, crystal_transfer, barter]
      - name: payment_status
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [success, failed, refunded]
      - name: amount_gold
        data_type: number(38, 2)
      - name: paid_at
        data_type: timestamp_ntz
      - name: paid_date
        data_type: date
  - name: fct_wizard_order_behavior
    description: Customer behavior mart for commercial and lifecycle analysis. One row per customer.
    config:
      tags: [unoptimized]
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: varchar
        description: Primary key — wizard identifier.
        data_tests: [unique, not_null]
      - name: full_name
        data_type: varchar
        description: Wizard full name.
      - name: home_region
        data_type: varchar
        description: Conformed home region.
      - name: guild_name
        data_type: varchar
        description: Current guild name, if any.
      - name: membership_tier
        data_type: varchar
        description: Current guild membership tier, if any.
      - name: is_guild_member
        data_type: boolean
        description: Whether the wizard currently belongs to a guild.
      - name: first_order_at
        data_type: timestamp_ntz
        description: Timestamp of the wizard's first order.
      - name: latest_order_at
        data_type: timestamp_ntz
        description: Timestamp of the wizard's most recent order.
      - name: days_since_last_order
        data_type: integer
        description: Number of days since the wizard's most recent order.
      - name: lifetime_order_count
        data_type: integer
        description: Count of distinct orders placed by the wizard.
      - name: lifetime_net_revenue_gold
        data_type: number(38, 2)
        description: Lifetime net revenue from the wizard in gold crowns.
      - name: average_order_value_gold
        data_type: number(38, 2)
        description: Average net revenue per order for the wizard.
      - name: total_units_purchased
        data_type: integer
        description: Total units purchased across all order lines.
      - name: favorite_potion_category
        data_type: varchar
        description: Most frequently purchased potion category for the wizard.
      - name: regulated_potion_line_count
        data_type: integer
        description: Count of regulated-potion order lines purchased by the wizard.
      - name: estimated_total_supply_cost_gold
        data_type: number(38, 2)
        description: Intentionally bad-state estimated total supply cost rolled up inline from potion cost proxies.
      - name: estimated_gross_margin_gold
        data_type: number(38, 2)
        description: Intentionally bad-state estimated gross margin proxy computed inline.
      - name: high_cost_potion_line_count
        data_type: integer
        description: Count of higher-cost potion lines purchased by the wizard.
      - name: refunded_order_count
        data_type: integer
        description: Intended count of refunded orders; the bad-state fanout can inflate this value.
      - name: split_payment_order_count
        data_type: integer
        description: Intended count of split-payment orders; the bad-state fanout can inflate this value.
      - name: marketplace_order_count
        data_type: integer
        description: Intended count of marketplace orders; the bad-state fanout can inflate this value.
      - name: courier_order_count
        data_type: integer
        description: Intended count of courier orders; the bad-state fanout can inflate this value.
      - name: in_store_order_count
        data_type: integer
        description: Intended count of in-store orders; the bad-state fanout can inflate this value.

  - name: dim_suppliers
    description: Supplier dimension with supplied-ingredient count.
    config:
      contract:
        enforced: true
    columns:
      - name: supplier_id
        data_type: varchar
        description: Primary key — supplier identifier.
        data_tests: [unique, not_null]
      - name: supplier_name
        data_type: varchar
        description: Supplier display name.
      - name: region
        data_type: varchar
        description: Supplier region.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Northern Reaches", "Ember Coast", "Silverwood", "The Marshlands", "Crystal Vale"]
      - name: reliability_rating
        data_type: integer
        description: Supplier reliability rating from 1 to 5.
      - name: supplied_ingredient_count
        data_type: integer
        description: Count of ingredients supplied by the supplier.
      - name: contracted_since
        data_type: date
        description: Date the supplier contract started.

  - name: fct_brews
    description: Brew-batch-grain fact with estimated batch supply cost.
    config:
      contract:
        enforced: true
    columns:
      - name: brew_id
        data_type: varchar
        description: Primary key — brew identifier.
        data_tests: [unique, not_null]
      - name: potion_sku
        data_type: varchar
        description: FK to dim_potions.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_potions')
                field: potion_sku
      - name: shop_id
        data_type: varchar
        description: FK to dim_shops.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_shops')
                field: shop_id
      - name: brew_region
        data_type: varchar
        description: Region of the brewing shop.
      - name: cauldron_id
        data_type: varchar
        description: Brewing cauldron identifier.
      - name: quality_check
        data_type: varchar
        description: Quality-check result.
        data_tests:
          - accepted_values:
              arguments:
                values: [pass, fail]
      - name: passed_quality_check
        data_type: boolean
        description: Whether the batch passed quality check.
      - name: brewer_name
        data_type: varchar
        description: Brewer responsible for the batch.
      - name: batch_size
        data_type: integer
        description: Number of potion units brewed in the batch.
      - name: brew_duration_minutes
        data_type: integer
        description: Duration of the brew in minutes.
      - name: batch_supply_cost_gold
        data_type: number(38, 2)
        description: Estimated batch supply cost in gold crowns.
      - name: brewed_at
        data_type: timestamp_ntz
        description: Brew timestamp.
      - name: brewed_date
        data_type: date
        description: Brew date.

