version: 2

models:
  - name: int_orders_with_payments
    config:
      tags: [unoptimized]

    description: >
      Order grain enriched with line-item totals and rolled-up payment
      behavior (net revenue, amount paid, split/failed/refund flags).
    columns:
      - name: order_id
        description: Primary key — order identifier.
        data_tests: [unique, not_null]
      - name: net_revenue_gold
        description: Gross line revenue minus order-level discount, in gold.
        data_tests: [not_null]

      - name: source_updated_at
        description: Latest raw-record ingestion timestamp across the order, its line items, and its payment attempts; used by fct_orders to identify changed order IDs for incremental processing.
        data_tests: [not_null]


  - name: int_memberships_current
    description: >
      Current guild membership per customer (SCD2 collapsed to the open row),
      with guild name and tier joined in.
    columns:
      - name: customer_id
        description: Primary key — one current membership per customer.
        data_tests: [unique, not_null]
      - name: tier
        description: Current membership tier, lowercased.
        data_tests:
          - accepted_values:
              arguments:
                values: [apprentice, adept, archmage]

  - name: int_potion_supply_cost
    description: Cost to brew one unit of each potion (see model header for the unit assumption).
    columns:
      - name: potion_sku
        description: Primary key — one row per potion with a recipe.
        data_tests: [unique, not_null]
