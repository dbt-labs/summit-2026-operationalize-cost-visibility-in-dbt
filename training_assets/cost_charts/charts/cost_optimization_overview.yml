# Validated end-to-end with `dct validate` + `dct render` against live
# Snowflake data using the exact `profile: merlinco_apothecaries` this
# file ships with. What's still unverified is whether the *attendee*
# workshop role (not this trainer credential) has been granted SELECT on
# APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION - see README.md.
#
# Source views (all in APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION):
#   VW_SNOWFLAKE__COST_SAVINGS_SUMMARY
#   VW_SNOWFLAKE__CROSS_DOMAIN_INSIGHTS
#   VW_SNOWFLAKE__DBT_MODEL_OPTIMIZATIONS
#   VW_SNOWFLAKE__OPTIMIZATION_BACKLOG
#   VW_SNOWFLAKE__USER_LEVEL_COST_ATTRIBUTION
#   VW_SNOWFLAKE__WAREHOUSE_OPTIMIZATIONS

title: "Cost optimization workshop results"
description: "Snapshot from 2026-08-25 of the recommendations dbt's cost optimization package generated for the Merlin & Co. Apothecaries project."
source: cost_optimization

# dct's default theme title-cases every heading, KPI label, and table
# column header regardless of authored casing - confirmed by inspecting
# rendered SVG text nodes. style.font.case alone doesn't reach any of
# these (the default theme sets its own font.case per slot, which wins
# over the style.font fallback), so each slot is overridden directly to
# match dbt Labs' brand guideline (sentence-case headlines, not title
# case).
style:
  font:
    case: sentence
  title:
    font:
      case: sentence
  charts:
    kpi:
      label:
        font:
          case: sentence
    table:
      header:
        font:
          case: sentence

text: |
  These figures come from a single snapshot (2026-08-25), not a time series -
  there is only one date in the underlying data, so no trend chart is drawn
  here.

  **Reading the numbers:** the KPI row below uses
  `VW_SNOWFLAKE__COST_SAVINGS_SUMMARY` as the source of truth
  ($22,458.46/yr across materialization, warehouse, and clustering). Don't
  sum savings across the other views on this board - the backlog and
  model-level views repeat some of the same underlying recommendations
  (e.g. `fct_order_items` appears once for a materialization fix and again
  for a clustering fix), so adding them together double-counts.

  `__optimized` model variants (the trainer/take-home answer-key builds)
  are excluded everywhere on this board except the KPI row (which reads
  the pre-aggregated summary view as-is) so the numbers reflect the
  attendee-facing starter models only. The backlog ranking and effort
  breakdown are project-wide (all workshop models, e.g. `dim_potions`);
  the lab-models table further down is scoped to just the 5 models used
  in the live demo flow.

  "Recommendations" and "Quick wins" in the KPI row are counted by
  `VW_SNOWFLAKE__COST_SAVINGS_SUMMARY` itself (18 and 8) and won't match
  a manual count of bars on the charts below - the summary view's own
  definition of what counts as a distinct recommendation differs from a
  raw row count on `VW_SNOWFLAKE__OPTIMIZATION_BACKLOG` (23 rows).


queries:
  # ---- KPI row -------------------------------------------------------
  headline_totals: |
    SELECT
      SUM(ESTIMATED_ANNUAL_SAVINGS_USD) AS total_savings,
      SUM(TOTAL_RECOMMENDATIONS) AS total_recommendations,
      SUM(QUICK_WIN_COUNT) AS quick_wins
    FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__COST_SAVINGS_SUMMARY

  # Replaces an earlier per-user-cost KPI ($83.83/yr for one attendee user)
  # that invited a meaningless comparison against the $22,458 headline
  # figure. This is the actual biggest single line item on the board.
  top_recommendation: |
    SELECT ESTIMATED_ANNUAL_SAVINGS_USD AS savings, RECOMMENDATION AS recommendation
    FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__WAREHOUSE_OPTIMIZATIONS
    ORDER BY savings DESC
    LIMIT 1

  # ---- Savings by domain (cost vs. savings) ---------------------------
  # dct lowercases all result column names regardless of SQL casing, so
  # every column below is aliased in lowercase to match what the chart
  # field mappings actually see.
  domain_cost_vs_savings: |
    SELECT DOMAIN AS domain, 'Estimated cost' AS metric, ESTIMATED_ANNUAL_COST_USD AS value
    FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__COST_SAVINGS_SUMMARY
    UNION ALL
    SELECT DOMAIN AS domain, 'Estimated savings' AS metric, ESTIMATED_ANNUAL_SAVINGS_USD AS value
    FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__COST_SAVINGS_SUMMARY
    ORDER BY domain, metric

  # ---- Savings by effort category (the "cheap fixes, big wins" story) --
  # Same __optimized exclusion as backlog_ranked below - without it this
  # chart's totals don't tie to backlog_bar's ($21,789.77 vs $18,617.49).
  effort_savings: |
    SELECT
      EFFORT_CATEGORY AS effort_category,
      SUM(ESTIMATED_ANNUAL_SAVINGS_USD) AS savings,
      COUNT(*) AS recommendation_count
    FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__OPTIMIZATION_BACKLOG
    WHERE MODEL_NAME IS NULL OR MODEL_NAME NOT ILIKE '%__optimized'
    GROUP BY 1
    ORDER BY savings DESC

  # ---- Top backlog items, ranked, tail folded -------------------------
  # entity alone isn't unique (fct_order_items shows up once for a
  # materialization fix and once for a clustering fix) - appending DOMAIN
  # keeps every bar's x-category unique so the two don't collapse into one.
  backlog_ranked: |
    WITH backlog AS (
      SELECT
        COALESCE(MODEL_NAME, WAREHOUSE_NAME) AS entity,
        DOMAIN AS domain,
        ESTIMATED_ANNUAL_SAVINGS_USD AS savings
      FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__OPTIMIZATION_BACKLOG
      WHERE MODEL_NAME IS NULL OR MODEL_NAME NOT ILIKE '%__optimized'
    ),
    ranked AS (
      SELECT entity, domain, savings,
             ROW_NUMBER() OVER (ORDER BY savings DESC) AS rn
      FROM backlog
    )
    SELECT entity || ' - ' || domain AS item, domain, savings FROM ranked WHERE rn <= 8
    UNION ALL
    SELECT
      'Remaining ' || COUNT(*) || ' items' AS item,
      'various' AS domain,
      SUM(savings) AS savings
    FROM ranked WHERE rn > 8
    ORDER BY savings DESC

  # ---- The 5 scoped lab models -----------------------------------------
  scoped_models: |
    SELECT
      MODEL_NAME AS model_name,
      DOMAIN AS domain,
      RECOMMENDATION AS recommendation,
      ESTIMATED_ANNUAL_SAVINGS_USD AS savings,
      SUGGESTED_CLUSTERING_KEY AS suggested_clustering_key,
      INCREMENTAL_RECOMMENDATION_STATUS AS incremental_recommendation_status
    FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__DBT_MODEL_OPTIMIZATIONS
    WHERE MODEL_NAME IN ('fct_orders', 'fct_order_items', 'dim_wizards', 'fct_wizard_order_behavior', 'int_orders_with_payments')
    ORDER BY savings DESC

  # ---- Warehouse + cross-domain detail tables --------------------------
  # RECOMMENDATION on this view contains a literal em-dash in the source
  # data (the "Monitor" recommendation text) - swapped for a hyphen since
  # it renders as-is in the table. RECOMMENDATION_REASON is left as full
  # text: an earlier attempt to truncate it to avoid wrapping didn't
  # change the table's pagination behavior (see the rows: comment below),
  # so a shortened, still-wrapped sentence had no upside over the full one.
  warehouse_detail: |
    SELECT
      WAREHOUSE_NAME AS warehouse_name,
      REPLACE(RECOMMENDATION, CHR(8212), '-') AS recommendation,
      RECOMMENDATION_REASON AS recommendation_reason,
      ESTIMATED_ANNUAL_SAVINGS_USD AS savings,
      BACKLOG_STATUS AS backlog_status
    FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__WAREHOUSE_OPTIMIZATIONS
    ORDER BY savings DESC

  # Excludes __optimized rows, same as backlog_ranked and scoped_models,
  # so this table doesn't surface trainer/take-home answer-key models to
  # an attendee audience. primary_recommendation and root_cause are
  # dropped from the SELECT: confirmed (2026-09-07) that every one of
  # these 4 rows shares the same value for both ("Apply incremental
  # config: merge" / "Query is expensive because it rebuilds the full
  # table every run"), so 2 of 4 columns were repeating identical text 4
  # times. That fact is stated once in the chart's subtitle below
  # instead. If a future snapshot has models with genuinely different
  # recommendations/root causes, re-add both columns here.
  cross_domain_detail: |
    SELECT
      MODEL_NAME AS model_name,
      SIGNAL_COUNT AS signal_count
    FROM APOTHECARIES.DBT_JSTAYTON_DBT_COST_OPTIMIZATION.VW_SNOWFLAKE__CROSS_DOMAIN_INSIGHTS
    WHERE MODEL_NAME NOT ILIKE '%__optimized'
    ORDER BY signal_count DESC

charts:
  savings_kpi:
    label: "Estimated annual savings"
    query: headline_totals
    type: kpi
    value: total_savings
    style:
      value:
        format: currency

  recs_kpi:
    label: "Recommendations"
    query: headline_totals
    type: kpi
    value: total_recommendations
    style:
      value:
        format: integer

  quick_wins_kpi:
    label: "Quick wins"
    query: headline_totals
    type: kpi
    value: quick_wins
    style:
      value:
        format: integer

  top_recommendation_kpi:
    label: "Top single recommendation"
    query: top_recommendation
    type: kpi
    value: savings
    style:
      value:
        format: currency
    support:
      value: recommendation

  domain_bar:
    title: "Cost vs. savings by domain"
    subtitle: "Materialization's near-100% savings is the cost of unnecessary full rebuilds, not a risk-free win"
    type: bar
    query: domain_cost_vs_savings
    x: domain
    y: value
    color: metric
    style:
      # stack: none confirmed against src/dbt_charts/data/schemas/yaml/0.5.0.json
      # (BarChartStyle.stack enum: none/zero/normalize/center). number_format's
      # accepted values weren't checked past the property existing - confirm
      # with `dct validate` once installed.
      stack: none
      number_format: currency

  effort_bar:
    title: "Savings by effort category"
    subtitle: "Most savings sit in config_change / actionable_review, not sql_refactor"
    type: bar
    query: effort_savings
    x: effort_category
    y: savings
    style:
      number_format: currency
      # endpoint_labels was only seen paired with orientation: horizontal
      # in the reference examples - confirm it also renders on a vertical
      # (default-orientation) bar via `dct validate`.
      endpoint_labels:
        visible: true

  backlog_bar:
    title: "Top backlog items by estimated annual savings"
    subtitle: "Project-wide, all workshop models - not limited to the 5 lab-flow models below"
    type: bar
    query: backlog_ranked
    x: item
    y: savings
    color: domain
    sort:
      by: savings
      order: desc
    # KNOWN COSMETIC ISSUE, not fixed: the "Remaining N items" catch-all
    # bar gets a full categorical hue from `color: domain`, competing
    # visually with the three real domains as if it were a fourth one.
    # Tried `conditional_formatting` on the `domain` column to force it
    # gray - dct rejects this outright: "chart.color conflicts with
    # conditional_formatting rules on column 'domain' ... Use one
    # surface." The only other lever, style.color.categorical.palette,
    # takes a positional list of color stops matched to the categorical
    # domain's encounter/sort order - fixable, but only safely with a
    # rendered check of which position 'various' actually lands in,
    # which wasn't available when this was last touched. Left as-is.
    style:
      orientation: horizontal
      number_format: currency
      endpoint_labels:
        visible: true

  scoped_models_table:
    title: "Lab models: recommendations"
    type: table
    query: scoped_models
    style:
      columns:
        model_name:
          label: Model
        domain:
          label: Domain
        recommendation:
          label: Recommendation
        savings:
          label: Est. annual savings
          format: currency
          scale:
            background:
              palette: dbt-seq-blue
        suggested_clustering_key:
          label: Suggested clustering key
        incremental_recommendation_status:
          label: Incremental status

  warehouse_table:
    title: "Warehouse optimizations"
    type: table
    query: warehouse_detail
    style:
      # pagination.enabled: false was untried in the earlier investigation
      # (only min_height, which genuinely doesn't exist on tables, and
      # page_rows, which the physical-fit check overrode). Verify this
      # actually shows both rows on one page, not just suppresses the
      # paginator UI while still clipping - render-tested below.
      pagination:
        enabled: false
      columns:
        warehouse_name:
          label: Warehouse
        recommendation:
          label: Recommendation
        recommendation_reason:
          label: Why
        savings:
          label: Est. annual savings
          format: currency
        backlog_status:
          label: Status

  cross_domain_table:
    title: "Cross-domain insights"
    subtitle: "All 4 models share the same root cause (rebuilds the full table every run) and the same fix (apply incremental config: merge)"
    type: table
    query: cross_domain_detail
    style:
      columns:
        model_name:
          label: Model
        signal_count:
          label: Signals

rows:
  - title: "Headline"
    grid:
      columns: 24
      items:
        - item: savings_kpi
          col_span: 6
        - item: recs_kpi
          col_span: 6
        - item: quick_wins_kpi
          col_span: 6
        - item: top_recommendation_kpi
          col_span: 6

  - cols:
      - domain_bar
      - effort_bar

  - cols:
      - backlog_bar

  - title: "Lab models (Demos 01-05)"
    cols:
      - scoped_models_table

  # warehouse_table used to client-side paginate to 1 row per page here
  # (fixed via style.pagination.enabled: false on the chart above - the
  # table's own height genuinely grows to fit both rows once pagination
  # chrome isn't reserving/capping page size; confirmed via the rendered
  # SVG height and the second row's y-position, both comfortably inside
  # the box, not clipped).
  - cols:
      - warehouse_table

  - cols:
      - cross_domain_table
