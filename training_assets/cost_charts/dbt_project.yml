# Minimal dbt project required by dbt-charts' "sibling rule": a
# `type: dbt_profile` source in dbt_charts.yml only resolves profiles.yml
# when a dbt_project.yml exists in the same directory as dbt_charts.yml.
# This board queries fully-qualified tables directly (no ref()/source()),
# so nothing else about this file is exercised - `profile:` here is unused
# by our named source (which pins profile: fka explicitly in
# dbt_charts.yml), but is required to be a valid, non-empty string.
name: "cost_optimization_charts"
version: "1.0.0"
config-version: 2
profile: "fka"
